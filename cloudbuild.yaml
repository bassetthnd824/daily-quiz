steps:
  # Step 1: Run unit tests
  - name: 'node:24'
    id: 'app-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm test

  # Step 2: Test and build Cloud Functions
  - name: 'node:24'
    id: 'functions-test-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm ci --prefix src/firebase/functions
        npm test --prefix src/firebase/functions
        npm run build --prefix src/firebase/functions

  # Step 3: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash' 
    args:
      - '-c'
      - |
        docker build -t ${_DEPLOY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/daily-quiz:${COMMIT_SHA} \
        --secret id=CSRF_SECRET,env=CSRF_SECRET \
        --secret id=FIREBASE_SERVICE_ACCOUNT,env=FIREBASE_SERVICE_ACCOUNT \
        --secret id=FIREBASE_WEB_CONFIG,env=FIREBASE_WEB_CONFIG \
        .
    secretEnv: 
      - 'CSRF_SECRET'
      - 'FIREBASE_SERVICE_ACCOUNT'
      - 'FIREBASE_WEB_CONFIG'

    env:
      - "DOCKER_BUILDKIT=1" # Enable Docker BuildKit

  # Step 4: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_DEPLOY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/daily-quiz:${COMMIT_SHA}'

  # Step 5: Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_DEPLOY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/daily-quiz:${COMMIT_SHA}'
      - '--region'
      - '${_DEPLOY_REGION}'
      - '--allow-unauthenticated' # Optional: Allow public access
      - '--port'
      - '3000' # Next.js default port
      - '--set-secrets'
      - 'CSRF_SECRET=CSRF_SECRET:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest'

  # Step 6: Deploy Cloud Functions
  - name: 'node:24'
    id: 'functions-deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm ci --prefix src/firebase/functions
        npx --yes firebase-tools@latest deploy --only functions --project "${PROJECT_ID}" --non-interactive --force

availableSecrets:
  secretManager:
  - versionName: projects/daily-quiz-464300/secrets/CSRF_SECRET/versions/latest
    env: 'CSRF_SECRET'
  - versionName: projects/daily-quiz-464300/secrets/FIREBASE_SERVICE_ACCOUNT/versions/latest
    env: 'FIREBASE_SERVICE_ACCOUNT'
  - versionName: projects/daily-quiz-464300/secrets/FIREBASE_WEB_CONFIG/versions/latest
    env: 'FIREBASE_WEB_CONFIG'
options:
  logging: CLOUD_LOGGING_ONLY
